[project]
name = "graphrag-navigator"
version = "0.1.0"
description = "Jurisdiction-aware, citation-grounded regulatory Q&A with dual-channel GraphRAG retrieval"
requires-python = ">=3.11"
dependencies = [
    # Core server
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",

    # Document parsing
    "PyMuPDF>=1.25.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",

    # Embeddings (local, runs on CPU)
    "sentence-transformers>=3.0.0",

    # Vector DB (sqlite extension)
    "sqlite-vec>=0.1.6",

    # Graph DB (embedded)
    "kuzu>=0.8.0",

    # Data processing
    "numpy>=1.26.0",
    "pandas>=2.0.0",

    # LLM provider SDKs
    "groq>=0.11.0",
    "openai>=1.50.0",
    "google-genai>=1.0.0",

    # Testing
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
